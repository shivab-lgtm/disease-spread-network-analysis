name: epiwatch
description: "Disease Spread Network Analysis platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: any
  flutter_riverpod: any
  dio: any
  fl_chart: ^1.2.0
  flutter_map: any
  latlong2: any
  file_selector: any
  flutter_dotenv: any
  pdf: any
  printing: any

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  vector_math: 2.2.0

flutter:
  uses-material-design: true
  assets:
    - .env
